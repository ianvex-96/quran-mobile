name: Upload Dependency List and Debug App
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apkdeps:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the Code
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version-file: .github/workflows/.java-version

      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_ROOT" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug Apk
        run: ./gradlew :app:assembleMadaniDebug -PdisableFirebase

      - name: Upload Debug Apk
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: latest-apk
          path: "app/build/outputs/apk/madani/debug/app-madani-debug.apk"

      - name: Get dependencies list
        run: ./gradlew :app:dependencies --configuration madaniReleaseRuntimeClasspath > dependencies.txt

      - name: Upload dependencies list
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: dependencies
          path: dependencies.txt
